name: Build Windows EXE

on:
  push:
    branches:
      - main
    paths:
      - "imap_migrator.py"
      - "build.bat"
      - ".github/workflows/build-windows-exe.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build IMAP Migrator for Windows
    runs-on: windows-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PyInstaller
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install --upgrade pyinstaller

      - name: Build windowed EXE
        shell: pwsh
        run: |
          python -m PyInstaller `
            --noconfirm `
            --clean `
            --onefile `
            --windowed `
            --name IMAP_Migrator `
            imap_migrator.py

      - name: Verify artifact
        shell: pwsh
        run: |
          if (-not (Test-Path "dist/IMAP_Migrator.exe")) {
            throw "dist/IMAP_Migrator.exe was not created"
          }
          Get-Item "dist/IMAP_Migrator.exe" | Format-List FullName,Length,LastWriteTime

      - name: Upload EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: IMAP_Migrator-windows
          path: dist/IMAP_Migrator.exe
          if-no-files-found: error
          retention-days: 30
